# Build and publish the Macula base images.
#
# ⚠ THE SCHEDULE IS THE POINT, not the push trigger. A base image's job is to
# carry current OS security updates. Built only on change, it rots quietly:
# nobody edits a Containerfile for months while Debian ships CVE fixes nobody
# picks up. The scheduled rebuild onto the newest dated base (resolved per
# image below) is what stops that, and it is the reason this repo is worth
# having at all rather than a Containerfile in a service repo.
name: build base images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      # Local tooling that goes into no image.
      - 'scripts/ci_gate.sh'
      - 'scripts/test_ci_gate.sh'
  schedule:
    # DAILY, 04:00 UTC. Hourly was considered and rejected on the evidence
    # rather than on cost: the build is free and takes ~60s, so cost is not the
    # constraint. The constraints are upstream and GitHub.
    #
    #   - Debian's archive does not move hourly, so 24x the builds chase a
    #     source that changes a few times a week.
    #   - GitHub delays or DROPS scheduled runs under load and hourly is its
    #     least reliable tier, so an hourly cron does not deliver hourly.
    #
    # Daily is where the cadence stops buying anything. If a specific CVE ever
    # needs picking up sooner, workflow_dispatch is immediate and exact.
    - cron: '0 4 * * *'
    # WEEKLY, Sunday 03:00 UTC, UNCACHED. The daily build is served from the
    # layer cache, so on a day the base did not move it reproduces the same
    # layers (measured: the 20260920 and 20260923 ci-otp images had identical
    # layers). This one re-runs every step. It is a separate cron so the build
    # step below can tell the two apart by `github.event.schedule'.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted on purpose. This repo is public, so hosted minutes are free
    # and unlimited, and the org's self-hosted runners are (correctly) not
    # offered to public repos. Building base images must not depend on the same
    # machines whose pipelines consume them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macula-ci-pq
            file: Containerfile.ci-pq
          # Elixir 1.18.4 on OTP 28.4.3, for mix services that cannot release
          # on 1.19 yet (see Containerfile.ci-pq-ex118). Same package, tags
          # prefixed ex118-, so macula-ci-pq:latest stays the 1.19 image.
          - image: macula-ci-pq
            file: Containerfile.ci-pq-ex118
            tag_prefix: ex118-
          - image: macula-ci-otp
            file: Containerfile.ci-otp
          - image: macula-pq-runtime
            file: Containerfile.pq-runtime

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Debian base MOVES; the tools on top of it do not. The Containerfile
      # pins OTP, Elixir, rebar3 and Rust exactly; this resolves the newest
      # dated Debian snapshot hexpm (or Debian) publishes for exactly that
      # pinned toolchain, so security updates land without anyone editing a
      # file. The Containerfile's own DEBIAN_VERSION is only the local-build
      # default. An unresolvable base FAILS the job: the assignment below is
      # its own statement, so the resolver's exit status stops the step.
      - name: Resolve the newest dated base
        id: base
        run: |
          debian=$(python3 scripts/newest_dated_base.py "${{ matrix.file }}")
          echo "debian=$debian" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.image }} (${{ matrix.file }}) on DEBIAN_VERSION=$debian"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/macula-io/${{ matrix.image }}
          # A timestamped tag as well as :latest, so a consumer that needs to
          # escape a bad rebuild has something to pin TO. Pinning to a digest
          # is stricter and also works.
          #
          # ⚠ YYYYMMDD-HHmm, not YYYYMMDD, and this is NOT about the schedule.
          # The scheduled build is daily, but push and workflow_dispatch builds
          # land on the same day too, so a date-only tag is claimed by more
          # than one build and each silently overwrites the last. "Pin to
          # yesterday's tag" would then resolve to whichever build ran last
          # rather than to a known image. A moving tag that LOOKS immutable is
          # worse than no tag, so the time stays in it at any cadence.
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}latest
            type=raw,value=${{ matrix.tag_prefix }}{{date 'YYYYMMDD-HHmm'}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The resolved base is stamped on the image, so what it was built on
          # is readable from the image itself, not only from this run's log.
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.macula.debian-base=${{ steps.base.outputs.debian }}
          build-args: |
            DEBIAN_VERSION=${{ steps.base.outputs.debian }}
          no-cache: ${{ github.event.schedule == '0 3 * * 0' }}
          cache-from: type=gha,scope=${{ matrix.image }}${{ matrix.tag_prefix }}
          cache-to: type=gha,scope=${{ matrix.image }}${{ matrix.tag_prefix }},mode=max
          provenance: false

  # The rocksdb images are DERIVED from two of the images above, by digest, so
  # they run after them and follow every rebuild of their bases. They are
  # separate from the matrix because they have no base of their own to
  # resolve: newest_dated_base.py reads one FROM per file, and
  # Containerfile.rocksdb has three stages, all FROM our own images.
  rocksdb:
    needs: build
    runs-on: ubuntu-latest
    # RocksDB itself compiles here, once per build, on a hosted runner: this
    # repo is public, so hosted minutes are free, and never on our own boxes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [macula-ci-otp-rocksdb, macula-pq-runtime-rocksdb, macula-ci-pq-ex118-rocksdb]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The bases the job above has just pushed, as exact digests. An
      # unresolvable one stops the job: never build on a guessed base.
      - name: Resolve the base digests
        id: bases
        run: |
          set -euo pipefail
          # digest <package> [tag]: the package's current digest at that tag.
          digest() {
            d=$(docker buildx imagetools inspect "ghcr.io/macula-io/$1:${2:-latest}" --format '{{json .Manifest}}' | jq -r .digest)
            case "$d" in sha256:*) echo "ghcr.io/macula-io/$1@$d" ;; *) echo "REFUSED: no digest for $1:${2:-latest}" >&2; exit 1 ;; esac
          }
          ci_otp=$(digest macula-ci-otp)
          pq_runtime=$(digest macula-pq-runtime)
          ci_pq_ex118=$(digest macula-ci-pq ex118-latest)
          {
            echo "ci_otp=$ci_otp"
            echo "pq_runtime=$pq_runtime"
            echo "ci_pq_ex118=$ci_pq_ex118"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.target }} on CI_OTP=$ci_otp PQ_RUNTIME=$pq_runtime CI_PQ_EX118=$ci_pq_ex118"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/macula-io/${{ matrix.target }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile.rocksdb
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.macula.base.ci-otp=${{ steps.bases.outputs.ci_otp }}
            io.macula.base.pq-runtime=${{ steps.bases.outputs.pq_runtime }}
            io.macula.base.ci-pq-ex118=${{ steps.bases.outputs.ci_pq_ex118 }}
          build-args: |
            CI_OTP=${{ steps.bases.outputs.ci_otp }}
            PQ_RUNTIME=${{ steps.bases.outputs.pq_runtime }}
            CI_PQ_EX118=${{ steps.bases.outputs.ci_pq_ex118 }}
          no-cache: ${{ github.event.schedule == '0 3 * * 0' }}
          # One scope for both targets: the librocksdb stage is identical in
          # both, so whichever job builds it first serves it to later runs.
          cache-from: type=gha,scope=rocksdb
          cache-to: type=gha,scope=rocksdb,mode=max
          provenance: false
