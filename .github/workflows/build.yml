# Build and publish the Macula base images.
#
# ⚠ THE SCHEDULE IS THE POINT, not the push trigger. A base image's job is to
# carry current OS security updates. Built only on change, it rots quietly:
# nobody edits a Containerfile for months while Debian ships CVE fixes nobody
# picks up. The weekly rebuild is what stops that, and it is the reason this
# repo is worth having at all rather than a Containerfile in a service repo.
name: build base images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  schedule:
    # HOURLY. It costs nothing (public repo, free unlimited hosted minutes,
    # ~60s a build) and it does not churn consumers: layers are
    # content-addressed and cached, so an hour where nothing moved upstream
    # reproduces the same digest and nobody re-pulls. A new image reaches
    # consumers exactly when an installed package actually changed.
    #
    # ⚠ Do not expect it to actually run hourly, and do not treat a gap as a
    # fault. GitHub delays or DROPS scheduled runs under load, and hourly is
    # the least reliable tier. The real ceiling on freshness is upstream
    # anyway: Debian's archive does not move hourly, so this buys much less
    # than 24x over daily. It is set here because it is free, not because the
    # benefit scales with the frequency.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted on purpose. This repo is public, so hosted minutes are free
    # and unlimited, and the org's self-hosted runners are (correctly) not
    # offered to public repos. Building base images must not depend on the same
    # machines whose pipelines consume them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macula-ci-pq
            file: Containerfile.ci-pq
          - image: macula-pq-runtime
            file: Containerfile.pq-runtime

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/macula-io/${{ matrix.image }}
          # A timestamped tag as well as :latest, so a consumer that needs to
          # escape a bad rebuild has something to pin TO. Pinning to a digest
          # is stricter and also works.
          #
          # ⚠ YYYYMMDD-HHmm, not YYYYMMDD. With a sub-daily schedule a
          # date-only tag is claimed by every build that day, each silently
          # overwriting the last, so "pin to yesterday's tag" would resolve to
          # whichever build happened to run last rather than to a known image.
          # A moving tag that LOOKS immutable is worse than no tag.
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false
