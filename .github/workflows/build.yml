# Build and publish the Macula base images.
#
# ⚠ THE SCHEDULE IS THE POINT, not the push trigger. A base image's job is to
# carry current OS security updates. Built only on change, it rots quietly:
# nobody edits a Containerfile for months while Debian ships CVE fixes nobody
# picks up. The scheduled rebuild onto the newest dated base (resolved per
# image below) is what stops that, and it is the reason this repo is worth
# having at all rather than a Containerfile in a service repo.
name: build base images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  schedule:
    # DAILY, 04:00 UTC. Hourly was considered and rejected on the evidence
    # rather than on cost: the build is free and takes ~60s, so cost is not the
    # constraint. The constraints are upstream and GitHub.
    #
    #   - Debian's archive does not move hourly, so 24x the builds chase a
    #     source that changes a few times a week.
    #   - GitHub delays or DROPS scheduled runs under load and hourly is its
    #     least reliable tier, so an hourly cron does not deliver hourly.
    #
    # Daily is where the cadence stops buying anything. If a specific CVE ever
    # needs picking up sooner, workflow_dispatch is immediate and exact.
    - cron: '0 4 * * *'
    # WEEKLY, Sunday 03:00 UTC, UNCACHED. The daily build is served from the
    # layer cache, so on a day the base did not move it reproduces the same
    # layers (measured: the 20260920 and 20260923 ci-otp images had identical
    # layers). This one re-runs every step. It is a separate cron so the build
    # step below can tell the two apart by `github.event.schedule'.
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted on purpose. This repo is public, so hosted minutes are free
    # and unlimited, and the org's self-hosted runners are (correctly) not
    # offered to public repos. Building base images must not depend on the same
    # machines whose pipelines consume them.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macula-ci-pq
            file: Containerfile.ci-pq
          - image: macula-ci-otp
            file: Containerfile.ci-otp
          - image: macula-pq-runtime
            file: Containerfile.pq-runtime

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Debian base MOVES; the tools on top of it do not. The Containerfile
      # pins OTP, Elixir, rebar3 and Rust exactly; this resolves the newest
      # dated Debian snapshot hexpm (or Debian) publishes for exactly that
      # pinned toolchain, so security updates land without anyone editing a
      # file. The Containerfile's own DEBIAN_VERSION is only the local-build
      # default. An unresolvable base FAILS the job: the assignment below is
      # its own statement, so the resolver's exit status stops the step.
      - name: Resolve the newest dated base
        id: base
        run: |
          debian=$(python3 scripts/newest_dated_base.py "${{ matrix.file }}")
          echo "debian=$debian" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.image }} on DEBIAN_VERSION=$debian"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/macula-io/${{ matrix.image }}
          # A timestamped tag as well as :latest, so a consumer that needs to
          # escape a bad rebuild has something to pin TO. Pinning to a digest
          # is stricter and also works.
          #
          # ⚠ YYYYMMDD-HHmm, not YYYYMMDD, and this is NOT about the schedule.
          # The scheduled build is daily, but push and workflow_dispatch builds
          # land on the same day too, so a date-only tag is claimed by more
          # than one build and each silently overwrites the last. "Pin to
          # yesterday's tag" would then resolve to whichever build ran last
          # rather than to a known image. A moving tag that LOOKS immutable is
          # worse than no tag, so the time stays in it at any cadence.
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The resolved base is stamped on the image, so what it was built on
          # is readable from the image itself, not only from this run's log.
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.macula.debian-base=${{ steps.base.outputs.debian }}
          build-args: |
            DEBIAN_VERSION=${{ steps.base.outputs.debian }}
          no-cache: ${{ github.event.schedule == '0 3 * * 0' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false
