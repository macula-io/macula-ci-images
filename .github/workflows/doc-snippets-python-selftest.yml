# Prove doc-snippets-python.yml before any repository calls it.
#
# `script` runs scripts/test_doc_snippets_python.sh against the check as embedded in
# the workflow: every shape that must pass passes, and every kind of broken block
# fails at the doc line that is wrong. `wired` calls the workflow itself on the
# fixture package.

name: doc snippets (python) self-test

on:
  push:
    paths:
      - '.github/workflows/doc-snippets-python.yml'
      - '.github/workflows/doc-snippets-python-selftest.yml'
      - 'scripts/doc_snippets_python.py'
      - 'scripts/embed_doc_snippets.sh'
      - 'scripts/test_doc_snippets_python.sh'
      - 'scripts/fixtures/doc_snippets/python/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-snippets-python-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The type checker and the YAML reader the test uses
        run: python -m pip install --quiet "mypy==1.15.0" pyyaml

      - name: Every pass and every failure, against the check as embedded
        env:
          PYTHON: python
        run: ./scripts/test_doc_snippets_python.sh

  wired:
    permissions:
      contents: read
    uses: ./.github/workflows/doc-snippets-python.yml
    with:
      working-directory: scripts/fixtures/doc_snippets/python
