# Are the base images reproducible? Two uncached builds of the same inputs,
# back to back, must give the same MANIFEST DIGEST, for every image this repo
# publishes: the same layers AND the same config (labels, created time,
# history), because a consumer pins the digest, not the layers.
#
# Both builds are pushed, as build.yml pushes, but to a registry that lives
# only inside the job (a registry:2 service on localhost:5000), so the digest
# compared is the one a publish would give, and nothing is published.
#
# This exists so "the same image" can mean the same bytes: a consumer that
# pins a base can then tell a real change (a new Debian package, a new
# toolchain) from a rebuild that only moved timestamps. Before this, every
# daily rebuild gave the rocksdb images new layers and every weekly uncached
# one did the same to the rest, with nothing inside having changed.
#
# What makes them reproducible (build.yml publishes the same way):
#   - SOURCE_DATE_EPOCH is midnight UTC of the dated Debian base the resolver
#     picks, NOT the commit time: a commit that changes no content must not
#     move an image, and a new Debian base is a real change that should. The
#     rocksdb images take it from their base's io.macula.debian-base label.
#   - the image output rewrites every file's timestamp to it;
#   - every label is a function of the inputs (scripts/image_labels.sh, which
#     build.yml publishes with too): created is the epoch, and there is no
#     build time and no commit sha in the config;
#   - the Containerfiles remove what records the time or the order things
#     happened in: apt, dpkg and ldconfig logs and caches, hex's cache.ets,
#     mix's /tmp lock and pubsub files, and rustup's components list (sorted:
#     rustup downloads components concurrently and lists them as they land);
#   - Elixir's own build (ex118) is compiled deterministic, with
#     SOURCE_DATE_EPOCH for its System.build_info date.
#
# Two back-to-back builds see the same apt archive; a different package
# version between weeks is a real change, and is meant to move the image.
# When the digests differ, the job says whether the layers or the config
# moved, and names the files or config fields that differ.
name: reproducibility

on:
  push:
    branches: [main]
    paths:
      - 'Containerfile.*'
      - '.github/workflows/build.yml'
      - '.github/workflows/reproducibility.yml'
      - 'scripts/newest_dated_base.py'
      - 'scripts/image_labels.sh'
      - 'scripts/compare_image_layers.sh'
      - 'scripts/compare_pushed_images.sh'
      - 'scripts/test_compare_image_layers.sh'
  schedule:
    # Sunday 05:00 UTC, after build.yml's weekly uncached build (03:00).
    - cron: '0 5 * * 0'
  workflow_dispatch:

permissions: {}

jobs:
  # The comparator's own test, so a change to it is proven before it judges
  # an image. Podman is on the hosted runner; see the test for why podman.
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test compare_image_layers.sh
        run: bash scripts/test_compare_image_layers.sh

  twice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macula-pq-runtime
            file: Containerfile.pq-runtime
          - image: macula-ci-otp
            file: Containerfile.ci-otp
          - image: macula-ci-pq
            file: Containerfile.ci-pq
          - image: macula-ci-pq-ex118
            file: Containerfile.ci-pq-ex118
          - image: macula-ci-gleam
            file: Containerfile.ci-gleam
    steps:
      - uses: actions/checkout@v4

      # On the host network, so buildkit can push to the job's registry.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Resolve the newest dated base and its epoch
        id: base
        run: |
          set -euo pipefail
          debian=$(python3 scripts/newest_dated_base.py "${{ matrix.file }}")
          day=$(grep -oE '[0-9]{8}' <<<"$debian" | head -1)
          [ -n "$day" ] || { echo "REFUSED: no date in the resolved base '$debian'"; exit 1; }
          echo "debian=$debian" >> "$GITHUB_OUTPUT"
          epoch=$(date -u -d "$day" +%s)
          labels=$(bash scripts/image_labels.sh "${{ matrix.image }}" "$epoch" "io.macula.debian-base=$debian")
          {
            echo "epoch=$epoch"
            echo 'labels<<LABELS'
            echo "$labels"
            echo 'LABELS'
          } >> "$GITHUB_OUTPUT"

      - name: First build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          outputs: type=image,name=localhost:5000/repro:a,push=true,rewrite-timestamp=true
          labels: ${{ steps.base.outputs.labels }}
          build-args: |
            DEBIAN_VERSION=${{ steps.base.outputs.debian }}
            SOURCE_DATE_EPOCH=${{ steps.base.outputs.epoch }}
          no-cache: true
          pull: true
          provenance: false

      - name: Second build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          outputs: type=image,name=localhost:5000/repro:b,push=true,rewrite-timestamp=true
          labels: ${{ steps.base.outputs.labels }}
          build-args: |
            DEBIAN_VERSION=${{ steps.base.outputs.debian }}
            SOURCE_DATE_EPOCH=${{ steps.base.outputs.epoch }}
          no-cache: true
          pull: true
          provenance: false

      - name: Compare the digests
        run: bash scripts/compare_pushed_images.sh localhost:5000/repro:a localhost:5000/repro:b

  # The rocksdb images, built FROM the images above by digest. Both builds get
  # the same base digests, today's published ones, so the only variable is the
  # build itself. librocksdb is compiled in both. A push that changes a base
  # AND Containerfile.rocksdb is proven here on the bases published before it;
  # the next run (or a dispatch after build.yml) proves the pair.
  twice-rocksdb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    strategy:
      fail-fast: false
      matrix:
        target: [macula-ci-otp-rocksdb, macula-pq-runtime-rocksdb, macula-ci-pq-ex118-rocksdb]
    steps:
      - uses: actions/checkout@v4

      # On the host network, so buildkit can push to the job's registry.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Resolve the base digests and the epoch
        id: bases
        run: |
          set -euo pipefail
          digest() {
            d=$(docker buildx imagetools inspect "ghcr.io/macula-io/$1:${2:-latest}" --format '{{json .Manifest}}' | jq -r .digest)
            case "$d" in sha256:*) echo "ghcr.io/macula-io/$1@$d" ;; *) echo "REFUSED: no digest for $1:${2:-latest}" >&2; exit 1 ;; esac
          }
          # Each digest is its own assignment, so a refusal stops the step
          # (inside an echo argument it would not).
          ci_otp=$(digest macula-ci-otp)
          pq_runtime=$(digest macula-pq-runtime)
          ci_pq_ex118=$(digest macula-ci-pq ex118-latest)
          debian=$(docker buildx imagetools inspect "$ci_otp" --format '{{json .Image}}' \
                     | jq -r '.config.Labels["io.macula.debian-base"] // empty')
          day=$(grep -oE '[0-9]{8}' <<<"$debian" | head -1)
          [ -n "$day" ] || { echo "REFUSED: $ci_otp has no dated io.macula.debian-base label ('$debian')"; exit 1; }
          epoch=$(date -u -d "$day" +%s)
          labels=$(bash scripts/image_labels.sh "${{ matrix.target }}" "$epoch" \
                     "io.macula.base.ci-otp=$ci_otp" \
                     "io.macula.base.pq-runtime=$pq_runtime" \
                     "io.macula.base.ci-pq-ex118=$ci_pq_ex118")
          {
            echo "ci_otp=$ci_otp"
            echo "pq_runtime=$pq_runtime"
            echo "ci_pq_ex118=$ci_pq_ex118"
            echo "epoch=$epoch"
            echo 'labels<<LABELS'
            echo "$labels"
            echo 'LABELS'
          } >> "$GITHUB_OUTPUT"

      - name: First build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile.rocksdb
          target: ${{ matrix.target }}
          platforms: linux/amd64
          outputs: type=image,name=localhost:5000/repro:a,push=true,rewrite-timestamp=true
          labels: ${{ steps.bases.outputs.labels }}
          build-args: |
            CI_OTP=${{ steps.bases.outputs.ci_otp }}
            PQ_RUNTIME=${{ steps.bases.outputs.pq_runtime }}
            CI_PQ_EX118=${{ steps.bases.outputs.ci_pq_ex118 }}
            SOURCE_DATE_EPOCH=${{ steps.bases.outputs.epoch }}
          no-cache: true
          provenance: false

      - name: Second build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Containerfile.rocksdb
          target: ${{ matrix.target }}
          platforms: linux/amd64
          outputs: type=image,name=localhost:5000/repro:b,push=true,rewrite-timestamp=true
          labels: ${{ steps.bases.outputs.labels }}
          build-args: |
            CI_OTP=${{ steps.bases.outputs.ci_otp }}
            PQ_RUNTIME=${{ steps.bases.outputs.pq_runtime }}
            CI_PQ_EX118=${{ steps.bases.outputs.ci_pq_ex118 }}
            SOURCE_DATE_EPOCH=${{ steps.bases.outputs.epoch }}
          no-cache: true
          provenance: false

      - name: Compare the digests
        run: bash scripts/compare_pushed_images.sh localhost:5000/repro:a localhost:5000/repro:b
