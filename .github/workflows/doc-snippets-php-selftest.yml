# Prove doc-snippets-php.yml before any repository calls it.
#
# `script` runs scripts/test_doc_snippets_php.sh against the check as embedded in
# the workflow: every shape that must pass passes, and every kind of broken block
# fails at the doc line that is wrong. `wired` calls the workflow itself on the
# fixture package, which proves the call shape, the composer install and the
# setup-php step a caller gets.

name: doc snippets (php) self-test

on:
  push:
    paths:
      - '.github/workflows/doc-snippets-php.yml'
      - '.github/workflows/doc-snippets-php-selftest.yml'
      - 'scripts/doc_snippets_php.py'
      - 'scripts/embed_doc_snippets.sh'
      - 'scripts/test_doc_snippets_php.sh'
      - 'scripts/fixtures/doc_snippets/php/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-snippets-php-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: PHPStan at the pinned version, and the YAML reader the test uses
        run: |
          composer global require --no-interaction --no-progress "phpstan/phpstan:2.3.1"
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
          python3 -m pip install --quiet pyyaml

      - name: Every pass and every failure, against the check as embedded
        run: ./scripts/test_doc_snippets_php.sh

  wired:
    permissions:
      contents: read
    uses: ./.github/workflows/doc-snippets-php.yml
    with:
      working-directory: scripts/fixtures/doc_snippets/php
