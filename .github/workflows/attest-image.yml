# Sign an image by digest, and attest its SBOM and its build provenance. Keyless.
#
# This exists so a box can refuse any image that did not come from our CI, built from
# our commit: the fleet reconciler verifies these three things before it runs a digest.
#
# Before anything is signed it runs release-guard.yml: the tag must name a commit on
# the default branch (or its line's release-<major>.<minor> maintenance branch), and
# must be the version this repository publishes.
#
# CALL IT from the job after the one that pushed the image, with that image's digest:
#
#   attest:
#     needs: build-and-push
#     permissions: { contents: read, packages: write, id-token: write }
#     uses: macula-io/macula-ci-images/.github/workflows/attest-image.yml@<full sha>
#     with:
#       image: ghcr.io/<org>/<name>
#       digest: ${{ needs.build-and-push.outputs.digest }}
#       # A private repository runs it on its own runner (team rule), a public one on
#       # GitHub's: a JSON runs-on value, default "ubuntu-latest".
#       runs-on: '["self-hosted","host00"]'
#       # Where the version sources live, when not at the repository root:
#       version-root: system
#
# Pin the call by FULL COMMIT SHA, never @main: the signing identity is this file at the
# ref the caller names, and a moving ref would let a later change to this file sign in
# the caller's name without the caller having looked at it.
#
# KEYLESS: cosign asks GitHub for an OIDC token (id-token: write), Fulcio issues a
# ten-minute certificate for this workflow's identity, and the signature and both
# attestations are recorded in the PUBLIC Rekor log (Raf's decision, all repositories,
# private ones included: the log shows the repository and workflow names, never source).
# No key exists to leak or rotate.
#
# THE IDENTITY A VERIFIER CHECKS (edge/gitops/image-signers in macula-fleet):
#   issuer    https://token.actions.githubusercontent.com
#   identity  https://github.com/macula-io/macula-ci-images/.github/workflows/attest-image.yml@<ref>
#   and the certificate's GitHub workflow repository = the CALLER (who built it).
#
# BY DIGEST ONLY. A tag is resolved by nobody here: what is signed is exactly the bytes
# the build pushed, and a tag moved afterwards cannot move a signature.
#
# The job ends by verifying what it just wrote, with the identity above, so a green run
# means a verifier will accept the digest, not only that three commands exited 0.

name: attest image

on:
  workflow_call:
    inputs:
      image:
        description: 'The image repository, no tag, e.g. ghcr.io/macula-services/mcl-echo'
        required: true
        type: string
      digest:
        description: 'The digest the build pushed, sha256:<64 hex>'
        required: true
        type: string
      version-root:
        description: 'The directory holding the version sources (mix.exs, rebar.config, ...), relative to the repository root; default the root'
        required: false
        type: string
        default: '.'
      runs-on:
        description: 'JSON runs-on value; default ["ubuntu-latest"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  # Nothing is signed until the release itself is shown to be sound: the tag on the
  # default branch, and its version the one this repository publishes. The bytes may
  # already be in the registry by now (the caller builds first), but a box refuses an
  # image that was not signed, so this is where a bad release stops.
  #
  # The two checks are written out here rather than called as
  # `uses: ./.github/workflows/release-guard.yml`, which would be read relative to the
  # CALLER's repository and fail the workflow as "not found" for every repository that
  # is not this one. The block is the same bytes as the one in release-guard.yml;
  # scripts/test_release_guard.sh fails if the two ever differ.
  guard:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check needs the tag and the default branch connected, which a
          # shallow checkout does not give.
          fetch-depth: 0
          # The caller's commit being released, so the version check reads the tagged
          # tree and not whatever a branch happens to hold now.
          ref: ${{ github.sha }}

      - name: Write the checks
        run: |
          mkdir -p "$RUNNER_TEMP/guard"
          cat > "$RUNNER_TEMP/guard/release_guard.sh" <<'RELEASE_GUARD_SCRIPT'
          #!/usr/bin/env bash
          # Refuse a release that must not happen. Two checks, both only for a v* tag, so a
          # repository that builds on every main push keeps building:
          #
          #   on-branch <ref> <sha> <default-branch>
          #       the tagged commit is an ancestor of origin/<default-branch>, so a release can
          #       never again sit on a side branch while the default branch is behind it
          #       (mcl_om 1.0.0, tagged on wire1-macula15, two commits ahead of main); or, for a
          #       hotfix on an older line, an ancestor of origin/release-<major>.<minor>, the
          #       maintenance branch that line's own tag names (v0.10.4 on release-0.10), and
          #       no other branch;
          #
          #   versions <ref> [root]
          #       the tag's version is the version the repository will publish: every .app.src
          #       vsn, the relx release version and mix.exs (BEAM), or the manifest the release
          #       publishes (Cargo.toml, package.json, pyproject.toml, *.csproj). A box that
          #       reports its release reads these, so a stale one publishes a lie (mcl-fovea
          #       0.6.1 reporting 0.4.2).
          #
          # A ref that is not a tag named v<version> is not a release: both checks print that
          # and exit 0. A release-only workflow that must refuse anything else asks for it with
          # the workflow's `require-tag' input, not here.
          #
          # Exit: 0 pass, 1 refused, 2 the check could not be made.
          #
          # The version is compared as the tag spells it minus the leading v, so a pre-release
          # tag v0.31.0-rc.6 matches an app version of 0.31.0-rc.6 and nothing else.
          set -uo pipefail

          prog="$(basename "$0")"
          usage() {
            echo "usage: $prog on-branch <ref> <sha> <default-branch>" >&2
            echo "       $prog versions <ref> [root]" >&2
            exit 2
          }

          # The version a ref names, or non-zero when the ref is not a release tag.
          tag_version() {
            local ref="$1"
            case "$ref" in
              refs/tags/v*) printf '%s\n' "${ref#refs/tags/v}" ;;
              *) return 1 ;;
            esac
          }

          # The maintenance branch a version belongs to, release-<major>.<minor>, or nothing
          # when the version does not start with two numbers.
          maintenance_branch() {
            printf '%s\n' "$1" | sed -n 's/^\([0-9][0-9]*\)\.\([0-9][0-9]*\)\..*/release-\1.\2/p'
          }

          # The value after the last "=" or ":"-style separator on a matched pattern, used by
          # the manifest readers below so each one stays a single sed or awk expression.
          first_line() { head -1; }

          # Every version source found, one "file<TAB>source<TAB>version" line each. A source
          # that exists but names no literal version is printed with an empty version, so the
          # check refuses it instead of silently passing.
          read_versions() {
            local root="$1" beam=0 f v relx_version="" relx_apps="" flat rest app

            if [ -f "$root/rebar.config" ]; then
              beam=1
              # One line, so a release tuple spread over several lines still reads whole, and
              # with the Erlang comments gone, so a tuple that was commented out is not read as
              # the release this repository publishes. `%' runs to the end of its line, so the
              # lines are stripped before they are joined.
              flat="$(sed 's/%.*//' "$root/rebar.config" | tr '\n' ' ')"
              # {relx, [{release, {name, "x.y.z"}, [app1, app2]}, ...]}: the FIRST tuple, which
              # is the one relx builds when the config names several.
              rest="${flat#*'{release,'}"
              relx_version="$(printf '%s' "$rest" | sed -n 's/^[[:space:]]*{[^,}]*,*[[:space:]]*"\([^"]*\)".*/\1/p')"
              relx_apps="$(printf '%s' "$rest" | sed -n 's/^[[:space:]]*{[^,}]*,*[[:space:]]*"[^"]*"[[:space:]]*}[[:space:]]*,[[:space:]]*\[\([^]]*\)\].*/\1/p')"
              # A library has no relx release and publishes its app's own vsn; a rebar.config
              # that names a release it will not spell as a literal is refused rather than
              # treated as absent.
              if [ -n "$relx_version" ] || printf '%s' "$flat" | grep -q '{release,'; then
                printf '%s\trelx release\t%s\n' rebar.config "$relx_version"
              fi
            fi

            # The apps the release names, when it names any: an umbrella app beside the release
            # (a helper at 0.1.0) is not what a box reports, and is not checked. Apps the relay
            # names that this tree does not hold (sasl, kernel) are OTP's and are skipped. The
            # file is found by name rather than at the two paths relx usually uses, so an app in
            # a tree laid out another way is still checked instead of quietly passing.
            if [ -n "$relx_apps" ]; then
              for app in $(printf '%s' "$relx_apps" | tr ',' ' '); do
                [ "$app" = "" ] && continue
                while IFS= read -r f; do
                  [ -n "$f" ] || continue
                  v="$(sed -n 's/.*{vsn,[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | first_line)"
                  printf '%s\tapp.src vsn\t%s\n' "${f#"$root"/}" "$v"
                done < <(find "$root" -name "$app.app.src" \
                           -not -path '*/.git/*' -not -path '*/_build/*' \
                           -not -path '*/deps/*' -not -path '*/_checkouts/*' \
                           -not -path '*/node_modules/*' | sort)
              done
            else
              while IFS= read -r f; do
                beam=1
                v="$(sed -n 's/.*{vsn,[[:space:]]*"\([^"]*\)".*/\1/p' "$f" | first_line)"
                printf '%s\tapp.src vsn\t%s\n' "${f#"$root"/}" "$v"
              done < <(find "$root" -name '*.app.src' \
                         -not -path '*/.git/*' -not -path '*/_build/*' \
                         -not -path '*/deps/*' -not -path '*/_checkouts/*' -not -path '*/node_modules/*' | sort)
            fi

            if [ -f "$root/mix.exs" ]; then
              beam=1
              v="$(awk '/def project/ { seen = 1 }
                        seen && match($0, /version:[[:space:]]*"[^"]*"/) {
                          s = substr($0, RSTART, RLENGTH); sub(/^[^"]*"/, "", s); sub(/"$/, "", s)
                          print s; exit }' "$root/mix.exs")"
              printf '%s\tmix project version\t%s\n' mix.exs "$v"
            fi

            # Other stacks only when the tree is not a BEAM release: a docs site's package.json
            # in a BEAM repository is not what the release publishes.
            if [ "$beam" -eq 0 ]; then
              if [ -f "$root/Cargo.toml" ]; then
                v="$(awk '/^\[package\]/ { p = 1 } p && /^[[:space:]]*version[[:space:]]*=/ {
                          s = $0; sub(/^[^"]*"/, "", s); sub(/".*/, "", s); print s; exit }' "$root/Cargo.toml")"
                printf '%s\tpackage version\t%s\n' Cargo.toml "$v"
              fi
              if [ -f "$root/package.json" ]; then
                v="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' "$root/package.json" | first_line)"
                printf '%s\tpackage version\t%s\n' package.json "$v"
              fi
              if [ -f "$root/pyproject.toml" ]; then
                v="$(awk '/^[[:space:]]*version[[:space:]]*=/ {
                          s = $0; sub(/^[^"]*"/, "", s); sub(/".*/, "", s); print s; exit }' "$root/pyproject.toml")"
                printf '%s\tproject version\t%s\n' pyproject.toml "$v"
              fi
              while IFS= read -r f; do
                v="$(sed -n 's/.*<Version>[[:space:]]*\([^<]*\)<.*/\1/p' "$f" | first_line)"
                printf '%s\tassembly version\t%s\n' "${f#"$root"/}" "$v"
              done < <(find "$root" -name '*.csproj' -not -path '*/.git/*' -not -path '*/bin/*' -not -path '*/obj/*' | sort)
            fi
          }

          check_on_branch() {
            local ref="$1" sha="$2" default="$3" version default_ref maint

            if ! version="$(tag_version "$ref")"; then
              echo "release guard: $ref is not a release tag, so the commit may be anywhere"
              return 0
            fi

            # The full ref, never the short origin/<default>. Git looks for refs/tags/<name>
            # before refs/remotes/<name>, and a checkout with fetch-depth: 0 brings every tag, so
            # a tag pushed as origin/main would be read as the default branch: the commit would
            # then be an ancestor of itself, the guard would print ok, and the release would be
            # signed. Naming the remote-tracking ref in full leaves nothing to shadow it: neither
            # refs/tags nor refs/heads is consulted for a name that starts with refs/.
            default_ref="refs/remotes/origin/$default"

            if ! git rev-parse --verify --quiet "$default_ref^{commit}" > /dev/null; then
              echo "release guard: origin/$default is not in this checkout; fetch the default" >&2
              echo "release guard: branch with fetch-depth: 0 before calling the guard" >&2
              return 2
            fi

            if git merge-base --is-ancestor "$sha" "$default_ref"; then
              echo "release guard: ok, $sha is on origin/$default (tag v$version)"
              return 0
            fi

            # A hotfix on an older line is cut from that line's maintenance branch, and the tag
            # alone names which one: v0.10.4 may sit on release-0.10, never on release-0.11 or
            # on a branch the caller names, so a workflow file on the tagged commit cannot pick
            # its own. Named in full for the same reason as the default branch.
            maint="$(maintenance_branch "$version")"
            if [ -n "$maint" ] && git rev-parse --verify --quiet "refs/remotes/origin/$maint^{commit}" > /dev/null \
               && git merge-base --is-ancestor "$sha" "refs/remotes/origin/$maint"; then
              echo "release guard: ok, $sha is on origin/$maint, the maintenance branch of v$version"
              return 0
            fi

            echo "release guard: REFUSED, tag v$version names $sha, which is not an ancestor of"
            echo "release guard: origin/$default${maint:+ or origin/$maint}. A release built from a"
            echo "release guard: side branch leaves the release to be cut again from the default branch:"
            git log --oneline "$default_ref..$sha" | sed 's/^/release guard:   only on the tag: /'
            printf '%s is not on origin/%s\n' "${sha:0:12}" "$default"
            return 1
          }

          check_versions() {
            local ref="$1" root="${2:-.}" version lines found=0 bad=0 file source found_version

            if ! version="$(tag_version "$ref")"; then
              echo "release guard: $ref is not a release tag, so no version is published"
              return 0
            fi

            lines="$(read_versions "$root")"
            if [ -z "$lines" ]; then
              echo "release guard: REFUSED, v$version names a release but $root holds no version" >&2
              echo "release guard: (no .app.src, rebar.config relx, mix.exs, Cargo.toml," >&2
              echo "release guard: package.json, pyproject.toml or *.csproj)" >&2
              return 1
            fi

            while IFS=$'\t' read -r file source found_version; do
              found=$((found + 1))
              if [ -z "$found_version" ]; then
                echo "release guard: FAIL $file names no literal $source"
                bad=$((bad + 1))
              elif [ "$found_version" = "$version" ]; then
                echo "release guard: ok   $file $source $found_version"
              else
                echo "release guard: FAIL $file $source $found_version, tag says $version"
                bad=$((bad + 1))
              fi
            done <<< "$lines"

            if [ "$bad" -ne 0 ]; then
              printf 'v%s disagrees with %s of %s version sources\n' "$version" "$bad" "$found"
              return 1
            fi
            echo "release guard: ok, v$version is what all $found version sources publish"
            return 0
          }

          case "${1:-}" in
            on-branch) shift; [ $# -eq 3 ] || usage; check_on_branch "$@" ;;
            versions)  shift; [ $# -ge 1 ] && [ $# -le 2 ] || usage; check_versions "$@" ;;
            *) usage ;;
          esac
          RELEASE_GUARD_SCRIPT

      - name: The tagged commit must be on the default branch, or its line's maintenance branch
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          # The caller's own default branch, from the event that started this run.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$DEFAULT_BRANCH" ] && [ "${REF#refs/tags/v}" != "$REF" ]; then
            echo "::error::the event payload names no default branch, so a release tag cannot be checked"
            exit 1
          fi
          bash "$RUNNER_TEMP/guard/release_guard.sh" on-branch "$REF" "$SHA" "$DEFAULT_BRANCH"

      - name: The tag's version must be the one this repository publishes
        env:
          REF: ${{ github.ref }}
          VERSION_ROOT: ${{ inputs.version-root }}
        run: bash "$RUNNER_TEMP/guard/release_guard.sh" versions "$REF" "$VERSION_ROOT"

  attest:
    needs: guard
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ${{ inputs.image }}
      DIGEST: ${{ inputs.digest }}
    steps:
      # Refuse a malformed input before anything is signed: a tag or a short digest would
      # sign whatever the registry resolves it to at that moment.
      - name: Check the inputs
        run: |
          case "$IMAGE" in
            ghcr.io/*/*) ;;
            *) echo "::error::image must be ghcr.io/<org>/<name>, got '$IMAGE'"; exit 1 ;;
          esac
          case "$IMAGE" in *[@:]*) echo "::error::image must carry no tag or digest, got '$IMAGE'"; exit 1 ;; esac
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest must be sha256:<64 hex>, got '$DIGEST'"; exit 1; }
          echo "REF=$IMAGE@$DIGEST" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
          # Per-job dir: self-hosted runners of one host share $HOME, and the
          # default $HOME/.cosign lets concurrent jobs overwrite one binary (#1).
          install-dir: ${{ runner.temp }}/cosign

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
        with:
          syft-version: v1.52.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Sign the digest
        run: cosign sign --yes "$REF"

      # From the registry, not a local daemon: the SBOM describes the pushed bytes.
      - name: SBOM (SPDX), attested
        run: |
          "${{ steps.syft.outputs.cmd }}" "registry:$REF" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      # SLSA v1 provenance: which repository, commit, workflow and run built this digest.
      # The builder id is the caller's workflow at its ref; the certificate that signs
      # the statement independently names both the caller and this file.
      - name: Provenance (SLSA v1), attested
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GREF: ${{ github.ref }}
          CALLER_WORKFLOW: ${{ github.workflow_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          python3 - > provenance.json <<'PY'
          import json, os, datetime
          e = os.environ
          print(json.dumps({
              "buildDefinition": {
                  "buildType": "https://github.com/macula-io/macula-ci-images/attest-image/v1",
                  "externalParameters": {"repository": e["REPO"], "ref": e["GREF"],
                                         "workflow": e["CALLER_WORKFLOW"]},
                  "resolvedDependencies": [{
                      "uri": f"git+https://github.com/{e['REPO']}@{e['GREF']}",
                      "digest": {"gitCommit": e["SHA"]}}]},
              "runDetails": {
                  "builder": {"id": f"https://github.com/{e['CALLER_WORKFLOW']}"},
                  "metadata": {"invocationId": e["RUN_URL"],
                               "startedOn": datetime.datetime.now(datetime.timezone.utc)
                                            .strftime("%Y-%m-%dT%H:%M:%SZ")}}}, indent=1))
          PY
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$REF"

      # What a box will check, checked here: this workflow's identity, the caller as the
      # workflow repository, and the commit. A green job means a verifier accepts it.
      - name: Verify what was written
        env:
          CALLER: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          id='^https://github\.com/macula-io/macula-ci-images/\.github/workflows/attest-image\.yml@'
          common=(--certificate-oidc-issuer https://token.actions.githubusercontent.com
                  --certificate-identity-regexp "$id"
                  --certificate-github-workflow-repository "$CALLER"
                  --certificate-github-workflow-sha "$SHA")
          cosign verify "${common[@]}" "$REF" > /dev/null
          cosign verify-attestation "${common[@]}" --type spdxjson "$REF" > /dev/null
          cosign verify-attestation "${common[@]}" --type slsaprovenance1 "$REF" > /dev/null
          echo "verified: $REF signed, SBOM and provenance attested by $CALLER@$SHA"
