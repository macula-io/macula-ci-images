# Every Go code block a module publishes compiles against its own packages.
#
# This exists so a reader who copies a Go example from a README or a guide gets
# code that builds, and an example that stops building fails the module's CI
# before it ships (macula-codebase-checks#8).
#
# CALL IT
#
#   docs:
#     permissions: { contents: read }
#     uses: macula-io/macula-ci-images/.github/workflows/doc-snippets-go.yml@<full sha>
#     # with:                            # all optional
#     #   working-directory: .           # the module (go.mod), relative to the repo root
#     #   runs-on: '["ubuntu-latest"]'
#
# Pin it by FULL COMMIT SHA, put it where the publish waits on it, and keep `**.md`
# and `guides/**` out of its workflow's `paths-ignore`: macula-codebase-checks
# reports a publishing repository where either is missing. A Go module publishes by
# its tag, so "where the publish waits on it" is the release workflow, when it has one.
#
# WHAT IT CHECKS. The docs a module ships under the working directory: README*.md
# and guides/**.md at any depth, docs/**.md without design records, plans, reports,
# backlogs and registers. In them, every block fenced go or golang:
#
#   a file        a block with a package clause, built as it stands
#   a fragment    any other block: top-level funcs stay at the top level, everything
#                 else is the body of a function, in a package that is not main;
#                 goimports supplies the imports it leaves out
#
# Each is built with `go build -gcflags=-e`, and a //line directive makes every
# error name the doc and its own line. What a fragment leaves to the reader is not
# an error: an identifier it uses and does not declare, a variable or import it
# does not use, a return with no function around it, a name bound twice by a block
# that lists alternatives, and `...` standing for elided code. A function, field,
# method or type the module does not have is, and so is a wrong argument and the
# syntax. A method called on an identifier the block does not declare cannot be
# checked: its type is not known.
#
# MARKERS, an HTML comment on the line before the fence:
#
#   <!-- doc_snippets: skip <reason> -->   a counter-example or a fragment; the
#                                          reason is required
#
# THE CHECK LIVES IN THIS FILE, not in the caller's tree, for the reason
# release-guard.yml gives: a reusable workflow runs in the CALLER's repository. The
# block below is written from scripts/doc_snippets_go.py by
# scripts/embed_doc_snippets.sh, and scripts/test_doc_snippets_go.sh runs its cases
# against the block as embedded, so what is tested is what a caller runs.

name: doc snippets (go)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'The Go module, relative to the repository root; default the root'
        required: false
        type: string
        default: '.'
      runs-on:
        description: 'JSON runs-on value; default ["ubuntu-latest"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  snippets:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod

      - name: Write the check
        run: |
          mkdir -p "$RUNNER_TEMP/doc_snippets"
          cat > "$RUNNER_TEMP/doc_snippets/doc_snippets_go.py" <<'DOC_SNIPPETS_GO_SCRIPT'
          #!/usr/bin/env python3
          """Every Go code block a module publishes compiles against its own packages.

          Usage: doc_snippets_go.py ROOT

          ROOT is a Go module (go.mod at its root). The docs read are the ones a module
          publishes: README*.md and guides/**.md at any depth, and docs/**.md without
          design records, plans, reports, backlogs or registers. The blocks read are the
          ones fenced go or golang.

          A block with a package clause is a file, and is built as it stands. Any other
          block is a fragment: top-level declarations (func, type, var, const) stay at
          the top level, and statements become the body of a function of their own,
          both in a package that is not main, so a fragment needs no main function.
          goimports supplies the imports a fragment leaves out, from the module and the
          standard library. Each block is built in a package of its own inside the
          module, with `go build -gcflags=-e` so every error is reported, and a //line
          directive makes each error name the doc and its own line.

          What a fragment leaves to the reader is not an error: an identifier it uses
          and does not declare (a ctx, a realm the prose has made), a variable or an
          import it does not use, a return that has no function around it. Everything
          about the module is still checked: a function, field, method or type that is
          not there, a wrong argument, the syntax. A misspelt local is a free identifier
          too, so nothing catches it, nor a misspelt package name (countr.New), nor a
          method called on a free identifier (p.Call(...) with no p in the block): its
          type is not known. A misspelt member of a package (os.ReadFil) is caught. A
          block of top-level funcs is the reader's own code and is held to the compiler
          but for the names it leaves to the prose; a block with a package clause is
          held to it entirely.

          Markers, an HTML comment on the line before the fence:

            <!-- doc_snippets: skip <reason> -->   not checked; the reason is required

          Exit 0 when every block builds, 1 when any fails (path:line: message), 2 when
          the check cannot run (no go.mod, no go toolchain).
          """

          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          SKIP_DIRS = {".git", "vendor", "node_modules", "_build", "deps", "target", "dist", ".venv"}
          SHIPPED_DOCS = re.compile(
              r"^(?!(?:.*/)?(?:fixtures|testdata|vectors?)/)"
              r"(?!docs/(?:design|adr|adrs|decisions|plans?|reports?|research)/)"
              r"(?!docs/(?:.*/)?[^/]*(?:backlog|register)[^/]*$)"
              r"(?:(?:.*/)?README[^/]*\.md|(?:.*/)?guides/.+\.md|docs/.+\.md)$", re.I)
          MARKER = re.compile(r"^\s*<!--\s*doc_snippets:\s*(\S+)\s*(.*?)\s*-->\s*$")
          FENCE = re.compile(r"^(\s*)(`{3,}|~{3,})\s*([^`\s]*)")
          # A top-level function or method: what only a file can hold. var, const and
          # type are statements too, so a block of them stays a function body.
          TOP_FUNC = re.compile(r"^func\s+(?:\([^)]*\)\s*)?[A-Za-z_]\w*\s*[\[(]")
          IMPORT_LINE = re.compile(r'^import\s+(?:\w+\s+)?"[^"]+"\s*$')
          GOIMPORTS = os.environ.get("GOIMPORTS", "golang.org/x/tools/cmd/goimports@v0.29.0")

          # What only a fragment produces, by what the block is. A dotted name
          # (pkg.Func) is never in here: a missing package member is the module's fault,
          # not the fragment's. A file block gets none of these: it is built as it stands.
          #
          # A block of top-level funcs is the reader's own code, complete as far as it
          # goes: only a name it leaves to the prose, and an import goimports made for
          # it, are excused.
          DECLS_ONLY = [
              re.compile(r"^undefined: [A-Za-z_][A-Za-z0-9_]*$"),
              re.compile(r'"[^"]+" imported and not used'),
          ]
          # A block of statements also has no function around it, so a return has none
          # to match, and it may list alternatives that bind the same names twice.
          STATEMENTS_ONLY = DECLS_ONLY + [
              re.compile(r"declared and not used"),
              re.compile(r"^too many return values"),
              re.compile(r"^not enough return values"),
              re.compile(r"^missing return$"),
              re.compile(r"^label \S+ defined and not used$"),
              re.compile(r"^no new variables on left side of :=$"),
          ]
          EXCUSED = {"file": [], "decls": DECLS_ONLY, "statements": STATEMENTS_ONLY}
          ERROR = re.compile(r"^(?:\S*?/)?(?P<path>[^:\s]+\.md):(?P<line>\d+)(?::\d+)?: (?P<msg>.*)$")


          def docs(root):
              found = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = sorted(d for d in dirnames if d not in SKIP_DIRS
                                       and not d.startswith("_doc_snippets"))
                  for name in sorted(filenames):
                      rel = os.path.relpath(os.path.join(dirpath, name), root).replace(os.sep, "/")
                      if SHIPPED_DOCS.search(rel):
                          found.append(rel)
              return found


          def blocks(text):
              """Every fenced block: (fence line, language word, marker, [(line, text)])."""
              lines, out, i, previous = text.split("\n"), [], 0, None
              while i < len(lines):
                  opened = FENCE.match(lines[i])
                  if not opened:
                      if lines[i].strip():
                          previous = lines[i]
                      i += 1
                      continue
                  indent, fence = len(opened.group(1)), opened.group(2)
                  word = opened.group(3).strip("{}.").split(",")[0].lower()
                  mark = MARKER.match(previous) if previous else None
                  start, body, i = i + 1, [], i + 1
                  while i < len(lines):
                      close = lines[i].strip()
                      if close.startswith(fence[0] * len(fence)) and not close.strip(fence[0]):
                          break
                      line = lines[i]
                      body.append((i + 1, line[indent:] if line[:indent].strip() == "" else line))
                      i += 1
                  out.append((start, word, (mark.group(1), mark.group(2)) if mark else None, body))
                  previous, i = None, i + 1
              return out


          def code_lines(body):
              return [(n, t) for n, t in body if t.strip() and not t.strip().startswith("//")]


          # Code a doc leaves out on purpose: `if err != nil { ... }`, or a line that is
          # only `...`. Go never writes `...` alone, so it is read as elided code.
          ELIDED_BRACES = re.compile(r"\{\s*\.\.\.\s*\}")
          ELIDED_LINE = re.compile(r"^\s*(?://\s*)?\.\.\.\s*$")


          def without_elisions(body):
              return [(n, "" if ELIDED_LINE.match(t) else ELIDED_BRACES.sub("{}", t)) for n, t in body]


          def hoist_imports(body):
              """The block's import lines (a single import or an import ( ... ) group),
              and the rest of it."""
              imports, rest, group = [], [], False
              for n, t in body:
                  stripped = t.strip()
                  if group:
                      if stripped == ")":
                          group = False
                      elif stripped and not stripped.startswith("//"):
                          imports.append(stripped)
                      continue
                  if stripped == "import (":
                      group = True
                  elif IMPORT_LINE.match(stripped):
                      imports.append(stripped[len("import"):].strip())
                  else:
                      rest.append((n, t))
              return imports, rest


          def source(doc, body):
              """The file a block becomes, as [package clause, rest...], without the
              imports between them, and the imports the block names. `doc` is the path
              the //line directives carry."""
              body = without_elisions(body)
              code = code_lines(body)
              if code and code[0][1].startswith("package "):
                  return None, [f"//line {doc}:{body[0][0]}\n"] + [t + "\n" for _, t in body]
              imports, rest = hoist_imports(body)
              code = code_lines(rest)
              if not code:
                  return None, None
              first = code[0][0]
              lines = [t for n, t in rest if n >= first]
              text = "".join(t + "\n" for t in lines)
              if any(TOP_FUNC.match(t) for _, t in code):
                  return ("decls", ["package snippet\n\n", f"//line {doc}:{first}\n", text]), imports
              return ("statements", ["package snippet\n\n", "func _() {\n", f"//line {doc}:{first}\n",
                                     text, "}\n"]), imports


          def imports_of(go_file):
              """The import paths goimports gave a file."""
              text = Path(go_file).read_text()
              block = re.search(r"^import \((.*?)^\)", text, re.S | re.M)
              single = re.findall(r'^import\s+((?:\w+\s+)?"[^"]+")', text, re.M)
              paths = single[:]
              if block:
                  paths += [line.strip() for line in block.group(1).splitlines()
                            if line.strip() and not line.strip().startswith("//")]
              return paths


          def package_names(root):
              """Every package name a block can mean: the module's own, the standard
              library's and the module's dependencies'. A bare `undefined: os` is never a
              free identifier: goimports added no import because the member the block
              uses is not there."""
              names = module_packages(root)
              for args in (["go", "list", "-f", "{{.ImportPath}} {{.Name}}", "std"],
                           ["go", "list", "-deps", "-f", "{{.ImportPath}} {{.Name}}", "./..."]):
                  out = subprocess.run(args, cwd=root, capture_output=True, text=True)
                  for line in out.stdout.splitlines():
                      path, _, name = line.partition(" ")
                      if name and name != "main" and "internal" not in path.split("/") \
                              and "vendor" not in path.split("/"):
                          names.add(name)
              return names


          def module_packages(root):
              """The package names the module's own directories declare."""
              names = set()
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS and not d.startswith((".", "_"))]
                  for name in filenames:
                      if name.endswith(".go") and not name.endswith("_test.go"):
                          head = Path(dirpath, name).read_text(errors="replace")
                          found = re.search(r"^package\s+(\w+)", head, re.M)
                          if found:
                              names.add(found.group(1))
                          break
              return names


          _DOC_LINES = {}


          def selects(root, line, number, name):
              """Does the doc line use `name` as a package (`name.Member`)? A free value
              that shares a package's name (a token, a user, a path) is not one."""
              path = relative(root, line)
              if path not in _DOC_LINES:
                  _DOC_LINES[path] = (root / path).read_text(errors="replace").split("\n")
              lines = _DOC_LINES[path]
              text = lines[number - 1] if 0 < number <= len(lines) else ""
              return re.search(rf"(?<![\w.]){re.escape(name)}\.[A-Za-z_]", text) is not None


          def relative(root, line):
              """The doc path an error names, relative to the module root."""
              path = line.strip().split(".md:", 1)[0] + ".md"
              prefix = str(root) + "/"
              if prefix in path:
                  return path[path.index(prefix) + len(prefix):]
              return path[2:] if path.startswith("./") else path


          def main(argv):
              if len(argv) != 2:
                  print("usage: doc_snippets_go.py ROOT", file=sys.stderr)
                  return 2
              root = Path(argv[1]).resolve()
              if not (root / "go.mod").is_file():
                  print(f"doc_snippets: no go.mod in {root}", file=sys.stderr)
                  return 2
              if not shutil.which("go"):
                  print("doc_snippets: no go toolchain on the PATH", file=sys.stderr)
                  return 2

              failures, built, files = [], [], []
              work = root / f"_doc_snippets_{os.getpid()}"
              scratch = Path(tempfile.mkdtemp(prefix="doc_snippets_go_"))
              try:
                  for doc in docs(root):
                      for start, word, marker, body in blocks((root / doc).read_text(errors="replace")):
                          if word not in ("go", "golang"):
                              continue
                          if marker and marker[0] == "skip":
                              if not marker[1]:
                                  failures.append((doc, start, "skip gives no reason"))
                              continue
                          if marker:
                              failures.append((doc, start, f"unknown marker '{marker[0]}'"))
                              continue
                          shaped, imports = source(str(root / doc), body)
                          if shaped is None and imports is None:
                              continue
                          if shaped is None:
                              # A whole file: built as it stands, imports and all.
                              files.append((doc, start, "file", imports))
                              continue
                          kind, parts = shaped
                          index = len(built)
                          # A directory per block: goimports reads a file's siblings, and a
                          # name one block declares must not stand in for another's import.
                          (scratch / f"b{index}").mkdir()
                          (scratch / f"b{index}" / "b.go").write_text(
                              "".join(parts[:1]) + "".join(f"import {i}\n" for i in imports)
                              + "".join(parts[1:]))
                          built.append((doc, start, kind, parts))
                  if built:
                      run = subprocess.run(["go", "run", GOIMPORTS, "-w", str(scratch)], cwd=root,
                                           capture_output=True, text=True)
                      if run.returncode != 0 and not run.stdout and "expected" not in run.stderr:
                          print(f"doc_snippets: goimports failed: {run.stderr.strip()}", file=sys.stderr)
                          return 2
                  packages_here = package_names(root)
                  packages = []
                  for index, (doc, start, kind, parts) in enumerate(built):
                      found = imports_of(scratch / f"b{index}" / "b.go")
                      header = parts[:1] + ([f"import (\n\t" + "\n\t".join(found) + "\n)\n"] if found else [])
                      packages.append((doc, start, kind, "".join(header + parts[1:])))
                  packages += [(doc, start, kind, "".join(text)) for doc, start, kind, text in files]
                  for index, (doc, start, kind, text) in enumerate(packages):
                      package = work / f"b{index}"
                      package.mkdir(parents=True)
                      (package / "main.go").write_text(text)
                      out = subprocess.run(["go", "build", "-gcflags=-e", "-o", os.devnull, "./" +
                                            package.relative_to(root).as_posix()],
                                           cwd=root, capture_output=True, text=True)
                      for line in out.stderr.splitlines():
                          error = ERROR.match(line.strip())
                          if not error:
                              continue
                          message = error.group("msg")
                          bare = re.match(r"^undefined: ([A-Za-z_]\w*)$", message)
                          if bare and bare.group(1) in packages_here and kind != "file" \
                                  and selects(root, line, int(error.group("line")), bare.group(1)):
                              # goimports found no member of that name in the package, so
                              # it added no import: the member is not there.
                              failures.append((relative(root, line), int(error.group("line")),
                                               f"undefined: {bare.group(1)}: the package "
                                               f"{bare.group(1)} has no member the block uses"))
                              continue
                          if any(rule.search(message) for rule in EXCUSED[kind]):
                              continue
                          failures.append((relative(root, line), int(error.group("line")), message))
                      if out.returncode != 0 and not any(ERROR.match(l.strip()) for l in out.stderr.splitlines()):
                          failures.append((doc, start, out.stderr.strip().splitlines()[-1]
                                           if out.stderr.strip() else "go build failed"))
              finally:
                  shutil.rmtree(work, ignore_errors=True)
                  shutil.rmtree(scratch, ignore_errors=True)

              for path, line, message in sorted(set(failures)):
                  print(f"{path}:{line}: {message}")
              print(f"doc_snippets: {len(set(failures))} failure(s) in {len(built) + len(files)} block(s)",
                    file=sys.stderr)
              return 1 if failures else 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          DOC_SNIPPETS_GO_SCRIPT

      - name: Check every Go block in the docs
        working-directory: ${{ inputs.working-directory }}
        run: python3 "$RUNNER_TEMP/doc_snippets/doc_snippets_go.py" .
