# Prove doc-snippets-ts.yml before any repository calls it.
#
# `script` runs scripts/test_doc_snippets_ts.sh against the check as embedded in the
# workflow: every shape that must pass passes, and every kind of broken block fails
# at the doc line that is wrong. `wired` calls the workflow itself on the fixture.

name: doc snippets (ts) self-test

on:
  push:
    paths:
      - '.github/workflows/doc-snippets-ts.yml'
      - '.github/workflows/doc-snippets-ts-selftest.yml'
      - 'scripts/doc_snippets_ts.py'
      - 'scripts/embed_doc_snippets.sh'
      - 'scripts/test_doc_snippets_ts.sh'
      - 'scripts/fixtures/doc_snippets/ts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-snippets-ts-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The type checker and the YAML reader the test uses
        run: |
          npm install --global --ignore-scripts typescript@7.0.2
          python3 -m pip install --quiet pyyaml

      - name: Every pass and every failure, against the check as embedded
        run: ./scripts/test_doc_snippets_ts.sh

  wired:
    permissions:
      contents: read
    uses: ./.github/workflows/doc-snippets-ts.yml
    with:
      working-directory: scripts/fixtures/doc_snippets/ts
