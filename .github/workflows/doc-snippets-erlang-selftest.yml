# Prove doc-snippets-erlang.yml before any repository calls it.
#
# Two jobs. `script` runs scripts/test_doc_snippets_erlang.sh, which runs the check
# as embedded in the workflow against a fixture project: every shape that must pass
# passes, and every kind of broken block fails at the doc line that is wrong. The
# red paths run on every push rather than being argued about.
#
# `wired` calls doc-snippets-erlang.yml itself, from this branch, on the fixture: it
# proves the call shape, the inputs and the permissions a caller needs. A failing
# block cannot be shown from here, because a called workflow that fails fails the
# calling job; the script job above is where red is shown.

name: doc snippets self-test

on:
  push:
    paths:
      - '.github/workflows/doc-snippets-erlang.yml'
      - '.github/workflows/doc-snippets-erlang-selftest.yml'
      - 'scripts/doc_snippets_erlang.escript'
      - 'scripts/embed_doc_snippets.sh'
      - 'scripts/test_doc_snippets_erlang.sh'
      - 'scripts/fixtures/doc_snippets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-snippets-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '28.4.3'
          rebar3-version: '3.27.0'
          version-type: strict

      - name: The YAML reader the test uses
        run: python3 -m pip install --quiet pyyaml

      - name: Every pass and every failure, against the check as embedded
        run: ./scripts/test_doc_snippets_erlang.sh

  wired:
    permissions:
      contents: read
    uses: ./.github/workflows/doc-snippets-erlang.yml
    with:
      working-directory: scripts/fixtures/doc_snippets/good
