# Every Python code block a package publishes type-checks against its own code.
#
# This exists so a reader who copies a Python example from a README or a guide gets
# code that matches the package, and an example that stops matching fails the
# package's CI before it ships (macula-codebase-checks#8).
#
# CALL IT
#
#   docs:
#     permissions: { contents: read }
#     uses: macula-io/macula-ci-images/.github/workflows/doc-snippets-python.yml@<full sha>
#     # with:                            # all optional
#     #   working-directory: .           # the project (pyproject.toml), relative to the repo root
#     #   python-version: '3.12'
#     #   runs-on: '["ubuntu-latest"]'
#
# Pin it by FULL COMMIT SHA, put it where the publish waits on it, and keep `**.md`
# and `guides/**` out of its workflow's `paths-ignore`: macula-codebase-checks
# reports a publishing repository where either is missing.
#
# WHAT IT CHECKS. The docs a package ships under the working directory: README*.md
# and guides/**.md at any depth, docs/**.md without design records, plans, reports,
# backlogs and registers. In them, every block fenced python, py, python3 or pycon
# (in a block with >>> prompts only the prompted lines are code). Each block is the
# body of an async function of its own, so a top-level await or return is valid,
# carrying the imports the doc's earlier blocks made; mypy reads them against the
# package's source (src/ or the root) without installing it, and a syntax error is
# caught first so it cannot stop the others. Every error names the doc's own line.
#
# The package must carry type hints (py.typed), or there is little to check. What a
# block leaves to the reader is not an error: a name it does not define, a name bound
# twice by alternatives, a return value, `...`. An attribute, method, argument,
# keyword or import the package does not have is, and so is a wrong type where its
# hints say otherwise, and a package of its own used and never imported. A method on
# a name the block does not define cannot be checked: its type is not known.
#
# MARKERS, an HTML comment on the line before the fence:
#
#   <!-- doc_snippets: skip <reason> -->   a counter-example or a fragment; the
#                                          reason is required
#
# THE CHECK LIVES IN THIS FILE, not in the caller's tree, for the reason
# release-guard.yml gives. The block below is written from
# scripts/doc_snippets_python.py by scripts/embed_doc_snippets.sh, and
# scripts/test_doc_snippets_python.sh runs its cases against the block as embedded.

name: doc snippets (python)

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'The Python project, relative to the repository root; default the root'
        required: false
        type: string
        default: '.'
      python-version:
        description: 'The Python the blocks are read as'
        required: false
        type: string
        default: '3.12'
      runs-on:
        description: 'JSON runs-on value; default ["ubuntu-latest"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  snippets:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: The type checker
        run: python -m pip install --quiet "mypy==1.15.0"

      - name: Write the check
        run: |
          mkdir -p "$RUNNER_TEMP/doc_snippets"
          cat > "$RUNNER_TEMP/doc_snippets/doc_snippets_python.py" <<'DOC_SNIPPETS_PYTHON_SCRIPT'
          #!/usr/bin/env python3
          """Every Python code block a package publishes type-checks against its own code.

          Usage: doc_snippets_python.py ROOT

          ROOT is a Python project (pyproject.toml or setup.py at its root) whose package
          carries type hints. The docs read are the ones a package publishes: README*.md
          and guides/**.md at any depth, and docs/**.md without design records, plans,
          reports, backlogs or registers. The blocks read are the ones fenced python, py
          or pycon; in a block with >>> prompts only the prompted lines are code.

          Each block becomes the body of an async function of its own, so a top-level
          await or return is valid and a block is checked as it stands, and mypy reads
          them all against the package's source (src/ or the root), the way an editor
          would. Each error names the doc and its own line.

          What a block leaves to the reader is not an error: a name it uses and does not
          define (a pool, a realm the prose has made), a name it binds twice by listing
          alternatives, a return value in a block that has no function around it.
          Everything about the package is: an attribute, method, argument or import it
          does not have, a wrong type where its hints say otherwise, the syntax, and a
          package of its own named and never imported. A method on a name the block does
          not define cannot be checked: its type is not known, and a misspelt
          top-level package (from fixture_countr import new) reads as a third-party one
          that is not installed. A function the block writes without annotations has its
          body checked all the same. A block reads the
          imports the doc's earlier blocks made, as a reader's session would.

          Markers, an HTML comment on the line before the fence:

            <!-- doc_snippets: skip <reason> -->   not checked; the reason is required

          Exit 0 when every block type-checks, 1 when any fails (path:line: message), 2
          when the check cannot run (not a Python project, no mypy).
          """

          import os
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          SKIP_DIRS = {".git", "node_modules", "_build", "deps", "target", "dist", ".venv", "venv",
                       ".tox", "build", "__pycache__"}
          SHIPPED_DOCS = re.compile(
              r"^(?!(?:.*/)?(?:fixtures|testdata|vectors?)/)"
              r"(?!docs/(?:design|adr|adrs|decisions|plans?|reports?|research)/)"
              r"(?!docs/(?:.*/)?[^/]*(?:backlog|register)[^/]*$)"
              r"(?:(?:.*/)?README[^/]*\.md|(?:.*/)?guides/.+\.md|docs/.+\.md)$", re.I)
          MARKER = re.compile(r"^\s*<!--\s*doc_snippets:\s*(\S+)\s*(.*?)\s*-->\s*$")
          FENCE = re.compile(r"^(\s*)(`{3,}|~{3,})\s*([^`\s]*)")
          PROMPT = re.compile(r"^(>>>|\.\.\.)( |$)")
          ERROR = re.compile(r"^(?P<file>[^:]+\.py):(?P<line>\d+)(?::\d+)?: error: (?P<msg>.*?)(?:\s+\[(?P<code>[\w-]+)\])?$")
          BARE_UNDEFINED = re.compile(r'^Name "([A-Za-z_]\w*)" is not defined$')

          # What only a block of a doc produces.
          FRAGMENT_ONLY = [
              re.compile(r'^Name "[A-Za-z_]\w*" already defined'),
              re.compile(r"^No return value expected$"),
              # `[...]` or `f(...)`: code the doc leaves out on purpose.
              re.compile(r"EllipsisType"),
          ]
          IMPORT = re.compile(r"^(?:import\s+\S|from\s+\S+\s+import\s)")


          def docs(root):
              found = []
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = sorted(d for d in dirnames if d not in SKIP_DIRS)
                  for name in sorted(filenames):
                      rel = os.path.relpath(os.path.join(dirpath, name), root).replace(os.sep, "/")
                      if SHIPPED_DOCS.search(rel):
                          found.append(rel)
              return found


          def blocks(text):
              """Every fenced block: (fence line, language word, marker, [(line, text)])."""
              lines, out, i, previous = text.split("\n"), [], 0, None
              while i < len(lines):
                  opened = FENCE.match(lines[i])
                  if not opened:
                      if lines[i].strip():
                          previous = lines[i]
                      i += 1
                      continue
                  indent, fence = len(opened.group(1)), opened.group(2)
                  word = opened.group(3).strip("{}.").split(",")[0].lower()
                  mark = MARKER.match(previous) if previous else None
                  start, body, i = i + 1, [], i + 1
                  while i < len(lines):
                      close = lines[i].strip()
                      if close.startswith(fence[0] * len(fence)) and not close.strip(fence[0]):
                          break
                      line = lines[i]
                      body.append((i + 1, line[indent:] if line[:indent].strip() == "" else line))
                      i += 1
                  out.append((start, word, (mark.group(1), mark.group(2)) if mark else None, body))
                  previous, i = None, i + 1
              return out


          def code_of(body):
              """The block's code as (doc line, text): prompted lines only when it has
              prompts, every line otherwise."""
              if any(PROMPT.match(t) for _, t in body):
                  return [(n, t[4:] if len(t) > 3 else "") for n, t in body if PROMPT.match(t)]
              return body


          def packages_of(root):
              """The import names the project's own packages have, and where their source is."""
              base = root / "src" if (root / "src").is_dir() else root
              names = {p.name for p in base.iterdir()
                       if p.is_dir() and (p / "__init__.py").is_file()} if base.is_dir() else set()
              names |= {p.stem for p in base.glob("*.py")} if base != root else set()
              return names, base


          def main(argv):
              if len(argv) != 2:
                  print("usage: doc_snippets_python.py ROOT", file=sys.stderr)
                  return 2
              root = Path(argv[1]).resolve()
              if not ((root / "pyproject.toml").is_file() or (root / "setup.py").is_file()):
                  print(f"doc_snippets: no pyproject.toml or setup.py in {root}", file=sys.stderr)
                  return 2
              if subprocess.run([sys.executable, "-m", "mypy", "--version"],
                                capture_output=True).returncode != 0:
                  print("doc_snippets: mypy is not installed for this interpreter", file=sys.stderr)
                  return 2

              own, base = packages_of(root)
              failures, files = [], {}
              work = Path(tempfile.mkdtemp(prefix="doc_snippets_python_"))
              try:
                  for doc in docs(root):
                      # The imports a reader has made by this point in the doc: a later
                      # block that uses reckon_db.X after the first block imported it is
                      # read in the same session.
                      carried = []
                      for start, word, marker, body in blocks((root / doc).read_text(errors="replace")):
                          if word not in ("python", "py", "pycon", "python3"):
                              continue
                          if marker and marker[0] == "skip":
                              if not marker[1]:
                                  failures.append((doc, start, "skip gives no reason"))
                              continue
                          if marker:
                              failures.append((doc, start, f"unknown marker '{marker[0]}'"))
                              continue
                          code = code_of(body)
                          if not any(t.strip() and not t.strip().startswith("#") for _, t in code):
                              continue
                          name = f"snippet_{len(files)}.py"
                          # The file, line by line, with the doc line each came from (None
                          # for what the check adds): the carried imports, the block's own
                          # top-level imports (an import * or a __future__ import is only
                          # valid at module level), the wrapper, then the rest of the block,
                          # one line each, a hoisted import left blank in its place.
                          hoisted = {n for n, t in code if IMPORT.match(t) and not t[:1].isspace()
                                     and not t.rstrip().endswith(("(", "\\"))}
                          rows = [(None, t) for t in carried]
                          rows += [(n, t) for n, t in code if n in hoisted]
                          rows += [(None, "async def _snippet() -> None:")]
                          rows += [(n, "" if n in hoisted or not t.strip() else f"    {t}") for n, t in code]
                          rows += [(None, "    pass")]
                          text = "".join(t + "\n" for _, t in rows)
                          where = [n for n, _ in rows]
                          # A syntax error stops mypy for every file, so it is found here
                          # and the block is left out of the type check.
                          try:
                              compile(text, name, "exec")
                          except SyntaxError as error:
                              at = (error.lineno or 1) - 1
                              failures.append((doc, where[at] if 0 <= at < len(where) and where[at]
                                               else start, f"syntax error: {error.msg}"))
                              continue
                          (work / name).write_text(text)
                          files[name] = (doc, where, dict(code))
                          carried += [t.strip() for _, t in code
                                      if IMPORT.match(t) and not t.rstrip().endswith(("(", "\\"))]
                  if files:
                      env = dict(os.environ, MYPYPATH=str(base))
                      # A missing third-party module is not ours to judge; a missing module
                      # of the package's own is. An unannotated function a reader writes
                      # (a handler, a callback) has its body checked too.
                      (work / "mypy.ini").write_text(
                          "[mypy]\nignore_missing_imports = True\nfollow_imports = silent\n"
                          "check_untyped_defs = True\n"
                          + "".join(f"\n[mypy-{p}]\nignore_missing_imports = False\n"
                                    f"\n[mypy-{p}.*]\nignore_missing_imports = False\n" for p in sorted(own)))
                      out = subprocess.run(
                          [sys.executable, "-m", "mypy", "--config-file", "mypy.ini",
                           "--no-error-summary", "--show-error-codes", "--no-color-output",
                           "--no-incremental", "--explicit-package-bases", *sorted(files)],
                          cwd=work, env=env, capture_output=True, text=True)
                      for line in out.stdout.splitlines() + out.stderr.splitlines():
                          error = ERROR.match(line.strip())
                          if not error or os.path.basename(error.group("file")) not in files:
                              continue
                          doc, where, texts = files[os.path.basename(error.group("file"))]
                          at = int(error.group("line")) - 1
                          doc_line = where[at] if 0 <= at < len(where) else None
                          if doc_line is None:
                              continue  # a carried import: reported where its own block is
                          message = error.group("msg")
                          bare = BARE_UNDEFINED.match(message)
                          if bare and bare.group(1) in own:
                              failures.append((doc, doc_line, f"{message}: the package {bare.group(1)} "
                                                              f"is used and never imported"))
                              continue
                          if bare and bare.group(1) in sys.stdlib_module_names and re.search(
                                  rf"(?<![\w.]){bare.group(1)}\.[A-Za-z_]", texts.get(doc_line, "")):
                              failures.append((doc, doc_line, f"{message}: the standard module "
                                                              f"{bare.group(1)} is used and never imported"))
                              continue
                          if bare or any(rule.search(message) for rule in FRAGMENT_ONLY):
                              continue
                          failures.append((doc, doc_line, message))
                      if out.returncode not in (0, 1):
                          print(f"doc_snippets: mypy could not run: {out.stderr.strip()}", file=sys.stderr)
                          return 2
              finally:
                  shutil.rmtree(work, ignore_errors=True)

              for path, line, message in sorted(set(failures)):
                  print(f"{path}:{line}: {message}")
              print(f"doc_snippets: {len(set(failures))} failure(s) in {len(files)} block(s)", file=sys.stderr)
              return 1 if failures else 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          DOC_SNIPPETS_PYTHON_SCRIPT

      - name: Check every Python block in the docs
        working-directory: ${{ inputs.working-directory }}
        run: python "$RUNNER_TEMP/doc_snippets/doc_snippets_python.py" .
