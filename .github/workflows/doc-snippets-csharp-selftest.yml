# Prove doc-snippets-csharp.yml before any repository calls it.
#
# `script` runs scripts/test_doc_snippets_csharp.sh against the check as embedded in
# the workflow: every shape that must pass passes, and every kind of broken block
# fails at the doc line that is wrong. `wired` calls the workflow itself on the
# fixture package, which proves the call shape and the setup-dotnet step a caller
# gets.

name: doc snippets (csharp) self-test

on:
  push:
    paths:
      - '.github/workflows/doc-snippets-csharp.yml'
      - '.github/workflows/doc-snippets-csharp-selftest.yml'
      - 'scripts/doc_snippets_csharp.py'
      - 'scripts/embed_doc_snippets.sh'
      - 'scripts/test_doc_snippets_csharp.sh'
      - 'scripts/fixtures/doc_snippets/csharp/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-snippets-csharp-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: The YAML reader the test uses
        run: python3 -m pip install --quiet pyyaml

      - name: Every pass and every failure, against the check as embedded
        run: ./scripts/test_doc_snippets_csharp.sh

  wired:
    permissions:
      contents: read
    uses: ./.github/workflows/doc-snippets-csharp.yml
    with:
      working-directory: scripts/fixtures/doc_snippets/csharp
