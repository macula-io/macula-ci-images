# Prove dependency-advisories.yml before any repository calls it.
#
# `script` runs scripts/test_dependency_advisories.py against the check as embedded
# in the workflow: every scanner's recorded output is read the way the tool prints
# it, every waiver rule holds, and every exit code is the one CI acts on. The
# recorded outputs need no network and no toolchain.
#
# `wired` calls the workflow itself on the fixture package, which proves the call
# shape, the setup a caller gets and the whole path end to end (resolution, scan,
# report, exit 0).

name: dependency advisories self-test

on:
  push:
    paths:
      - '.github/workflows/dependency-advisories.yml'
      - '.github/workflows/dependency-advisories-selftest.yml'
      - 'scripts/dependency_advisories.py'
      - 'scripts/embed_dependency_advisories.sh'
      - 'scripts/test_dependency_advisories.py'
      - 'scripts/pip-audit-requirements.txt'
      - 'scripts/fixtures/dependency_advisories/**'
  workflow_dispatch:
    inputs:
      prove-root-refusal:
        description: 'Run the job that MUST go red: the container path with no --user, proving the refusal step.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependency-advisories-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: The YAML reader the test uses
        run: python3 -m pip install --quiet pyyaml

      - name: Every scanner's output, every waiver rule, every exit code
        run: python3 scripts/test_dependency_advisories.py

  wired:
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-advisories.yml
    with:
      ecosystem: python
      working-directories: '["scripts/fixtures/dependency_advisories/python"]'

  # The container path, which is the shape a self-hosted caller has to use (a self-hosted
  # runner sets no ImageOS, so the setup-* steps above cannot run there). A stock python
  # image is enough to prove it for the python fixture: the check IS a Python script, so the
  # image needs python3 and the scanners this workflow installs itself. Nothing here is
  # macula-specific (full, not -slim: it carries git and curl), which is the point — if this job is green, `container` works, and a
  # caller can pin a ci-otp or ci-pq image for the ecosystem it actually scans.
  #
  # ON A HOSTED RUNNER, DELIBERATELY. This repository is public, and a public repository must
  # never point a job at a self-hosted runner: anyone's fork of it could open a pull request
  # and run code on the operator's machine. It would not have run anyway — the org's runner
  # group refuses public repositories — so the proof lives where it may: hosted runners are
  # free for a public repository, and `container:` runs on them. What is proven is still the
  # shape, not the runner: the same image, the same steps, the same refusals.
  wired-in-container:
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-advisories.yml
    with:
      ecosystem: python
      working-directories: '["scripts/fixtures/dependency_advisories/python"]'
      runs-on: '["ubuntu-latest"]'
      # Proves the option is applied: 1001 is the uid a GitHub-hosted runner uses, so the job runs
      # as that user and never as root. A self-hosted caller passes 1000:1000 instead, for the same
      # reason (see container-options): a root checkout breaks the next job on that runner.
      container-options: '--user 1001:1001'
      container: python:3.13@sha256:6a9220edda062e9223ea0784740a535987299420b96fbfd520b89bbd3e772485

  # OPT-IN, AND RED ON PURPOSE. The refusal above is the one step whose FAILING is the product,
  # and a calling job cannot require a reusable workflow's job to fail (`continue-on-error` is
  # not offered on a `uses:` job), so it cannot be asserted on every push — a permanently red
  # suite would say nothing about the next commit. Dispatch this workflow with
  # `prove-root-refusal: true` instead: then exactly this job must be the red one, failing in
  # `The container does not run as root` with the message naming `container-options`. That is
  # the proof, and every ordinary push skips the job.
  root-refusal-proven:
    name: the root refusal, expected to FAIL
    if: inputs.prove-root-refusal
    permissions:
      contents: read
    uses: ./.github/workflows/dependency-advisories.yml
    with:
      ecosystem: python
      working-directories: '["scripts/fixtures/dependency_advisories/python"]'
      runs-on: '["ubuntu-latest"]'
      container: python:3.13@sha256:6a9220edda062e9223ea0784740a535987299420b96fbfd520b89bbd3e772485
      # container-options deliberately absent: the image's default user is root, so the job must
      # refuse. Do not add it to make this green — that is what `wired-in-container` above is for.
