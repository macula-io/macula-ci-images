# Refuse a release that must not happen, for every repository that publishes one.
#
# Two checks, both of them only about a v* tag (any other ref passes, so a repository
# that builds images on every main push keeps building):
#
#   on-branch  the tagged commit is an ancestor of the default branch. mcl_om 1.0.0,
#              the version every service depends on, was tagged on a side branch two
#              commits ahead of main, and nothing stopped it.
#   versions   the tag's version is what the repository publishes: the relx release
#              version and the vsn of the apps it names (BEAM), or the manifest the
#              release publishes. mcl-fovea 0.6.1 shipped with a relx version of
#              0.4.2, so a box reporting its release reported the wrong one.
#
# CALL IT
#
#   guard:
#     permissions: { contents: read }
#     uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@<full sha>
#     # with:                                                        # all optional
#     #   runs-on: '["self-hosted","host00"]'
#     #   require-tag: true        # a release-only workflow, refuse anything else
#     #   ref: ...                 # default: the caller's github.ref
#     #   sha: ...                 # default: the caller's github.sha
#
# Pin the call by FULL COMMIT SHA, as with attest-image.yml. The caller must grant
# contents: read; both checks read the repository and nothing else. attest-image.yml
# calls it, so every image release gets it as soon as the caller's pin moves.
#
# In attest-image the build has already pushed bytes by the time this runs: what the
# guard stops there is the signing and both attestations, and a box refuses an image
# that was not signed. A repository that wants the guard ahead of its build calls it
# as its own first job.
#
# The checks live in scripts/release_guard.sh, which prints every version source it
# read and every one that disagreed. scripts/test_release_guard.sh proves each refusal
# and each pass on throwaway repositories and fixtures.

name: release guard

on:
  workflow_call:
    inputs:
      ref:
        description: 'The ref being released; default the caller''s github.ref'
        required: false
        type: string
        default: ''
      sha:
        description: 'The commit being released; default the caller''s github.sha'
        required: false
        type: string
        default: ''
      runs-on:
        description: 'JSON runs-on value; default ["ubuntu-latest"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      require-tag:
        description: 'Refuse a ref that is not a v* tag (a release-only workflow)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  on-branch:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check needs the tag and the default branch connected, which a
          # shallow checkout does not give.
          fetch-depth: 0

      - name: The ref must be a release tag when this caller says so
        if: ${{ inputs.require-tag }}
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::this release workflow runs only on a v* tag, got '$REF'"; exit 1 ;;
          esac

      # The default branch's name, so a repository that renames it needs no change here.
      - name: Which branch is the default one
        env:
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          branch="$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
                    -H 'Accept: application/vnd.github+json' "$API" \
                    | sed -n 's/^[[:space:]]*"default_branch":[[:space:]]*"\([^"]*\)".*/\1/p')"
          [ -n "$branch" ] || { echo "::error::could not read the default branch from $API"; exit 1; }
          echo "the default branch is $branch"
          echo "DEFAULT_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: The tagged commit must be on the default branch
        env:
          REF: ${{ inputs.ref || github.ref }}
          SHA: ${{ inputs.sha || github.sha }}
        run: ./scripts/release_guard.sh on-branch "$REF" "$SHA" "$DEFAULT_BRANCH"

  versions:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4

      - name: The ref must be a release tag when this caller says so
        if: ${{ inputs.require-tag }}
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::this release workflow runs only on a v* tag, got '$REF'"; exit 1 ;;
          esac

      - name: The tag's version must be the one the repository publishes
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: ./scripts/release_guard.sh versions "$REF"
