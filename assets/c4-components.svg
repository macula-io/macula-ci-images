<rect class="bound" x="16" y="40" width="684" height="866" rx="12"/>
<text class="t-bound" x="32" y="62">macula-ci-images [GitHub repository]</text>
<rect class="b-cmp" x="32" y="70" width="208" height="130" rx="10"/>
<text class="t-code" x="48" y="98">reproducibility</text>
<text class="t-type" x="48" y="116">[reproducibility.yml]</text>
<text class="t-desc" x="48" y="140">Sundays and on change: two</text>
<text class="t-desc" x="48" y="156">uncached builds, the same</text>
<text class="t-desc" x="48" y="172">manifest digest or red</text>
<rect class="b-sys" x="254" y="70" width="430" height="130" rx="10"/>
<text class="t-code" x="270" y="98">build.yml</text>
<text class="t-type" x="270" y="116">[workflow: daily, weekly uncached, push]</text>
<text class="t-desc" x="270" y="140">pinned-downloads: every download checksum-</text>
<text class="t-desc" x="270" y="156">pinned (check_pinned_downloads.py), first.</text>
<text class="t-desc" x="270" y="172">build: newest_dated_base.py picks the base by</text>
<text class="t-desc" x="270" y="188">digest; image_labels.sh; push. rocksdb: after.</text>
<rect class="bound" x="24" y="220" width="668" height="256" rx="12"/>
<text class="t-bound" x="40" y="242">Base images [Containerfile.*, pushed to ghcr.io/macula-io]</text>
<rect class="b-cmp" x="32" y="254" width="208" height="92" rx="10"/>
<text class="t-code" x="48" y="282">macula-ci-pq</text>
<text class="t-type" x="48" y="300">[Containerfile.ci-pq]</text>
<text class="t-desc" x="48" y="324">mix: Elixir 1.19.6, OTP</text>
<text class="t-desc" x="48" y="340">28.4.3, Rust 1.98.1</text>
<rect class="b-cmp" x="254" y="254" width="208" height="92" rx="10"/>
<text class="t-code" x="270" y="282">ci-pq ex118-*</text>
<text class="t-type" x="270" y="300">[Containerfile.ci-pq-ex118]</text>
<text class="t-desc" x="270" y="324">Elixir 1.18.4 on OTP 28.4.3,</text>
<text class="t-desc" x="270" y="340">for mix releases on 1.18</text>
<rect class="b-cmp" x="476" y="254" width="208" height="92" rx="10"/>
<text class="t-code" x="492" y="282">macula-ci-otp</text>
<text class="t-type" x="492" y="300">[Containerfile.ci-otp]</text>
<text class="t-desc" x="492" y="324">rebar3 3.27.0, OTP 28.4.3,</text>
<text class="t-desc" x="492" y="340">Rust 1.98.1</text>
<rect class="b-cmp" x="32" y="370" width="208" height="92" rx="10"/>
<text class="t-code" x="48" y="398">macula-ci-gleam</text>
<text class="t-type" x="48" y="416">[Containerfile.ci-gleam]</text>
<text class="t-desc" x="48" y="440">gleam118-*: Gleam 1.18.1</text>
<text class="t-desc" x="48" y="456">on OTP 28.4.3</text>
<rect class="b-cmp" x="254" y="370" width="208" height="92" rx="10"/>
<text class="t-code" x="270" y="398">macula-pq-runtime</text>
<text class="t-type" x="270" y="416">[Containerfile.pq-runtime]</text>
<text class="t-desc" x="270" y="440">Debian trixie, OpenSSL 3.5+:</text>
<text class="t-desc" x="270" y="456">a release's runtime stage</text>
<rect class="b-cmp" x="476" y="370" width="208" height="92" rx="10"/>
<text class="t-code" x="492" y="398">*-rocksdb (three)</text>
<text class="t-type" x="492" y="416">[Containerfile.rocksdb]</text>
<text class="t-desc" x="492" y="440">ci-otp, pq-runtime, ci-pq-ex118</text>
<text class="t-desc" x="492" y="456">plus librocksdb 11.1.2</text>
<rect class="bound" x="24" y="496" width="668" height="290" rx="12"/>
<text class="t-bound" x="40" y="518">Shared gates [reusable workflows, called pinned by full commit sha]</text>
<rect class="b-cmp" x="254" y="530" width="208" height="112" rx="10"/>
<text class="t-code" x="270" y="558">release-guard</text>
<text class="t-type" x="270" y="576">[release-guard.yml]</text>
<text class="t-desc" x="270" y="600">A v* tag: on the default</text>
<text class="t-desc" x="270" y="616">branch, and the version the</text>
<text class="t-desc" x="270" y="632">repository publishes</text>
<rect class="b-cmp" x="476" y="530" width="208" height="112" rx="10"/>
<text class="t-code" x="492" y="558">attest-image</text>
<text class="t-type" x="492" y="576">[attest-image.yml]</text>
<text class="t-desc" x="492" y="600">Runs the guard, then keyless</text>
<text class="t-desc" x="492" y="616">cosign: signature, SPDX SBOM,</text>
<text class="t-desc" x="492" y="632">SLSA provenance, by digest</text>
<rect class="b-cmp" x="32" y="530" width="208" height="112" rx="10"/>
<text class="t-code" x="48" y="558">dependency-advisories</text>
<text class="t-type" x="48" y="576">[dependency-advisories.yml]</text>
<text class="t-desc" x="48" y="600">Eight ecosystems: a known</text>
<text class="t-desc" x="48" y="616">advisory fails the run, or a</text>
<text class="t-desc" x="48" y="632">dated waiver in the repo</text>
<rect class="b-cmp" x="32" y="656" width="208" height="112" rx="10"/>
<text class="t-code" x="48" y="684">doc-snippets-*</text>
<text class="t-type" x="48" y="702">[six workflows]</text>
<text class="t-desc" x="48" y="726">Erlang, Go, Python, TS, C#,</text>
<text class="t-desc" x="48" y="742">PHP: published code blocks</text>
<text class="t-desc" x="48" y="758">compile and run</text>
<rect class="b-cmp" x="254" y="656" width="208" height="112" rx="10"/>
<text class="t-code" x="270" y="684">c4-model</text>
<text class="t-type" x="270" y="702">[c4-model.yml]</text>
<text class="t-desc" x="270" y="726">A context and a component</text>
<text class="t-desc" x="270" y="742">diagram in assets/, shown by</text>
<text class="t-desc" x="270" y="758">a README</text>
<rect class="b-cmp" x="476" y="656" width="208" height="112" rx="10"/>
<text class="t-name" x="492" y="684">Self-tests</text>
<text class="t-type" x="492" y="702">[*-selftest.yml]</text>
<text class="t-desc" x="492" y="726">Each check is a script in</text>
<text class="t-desc" x="492" y="742">scripts/, embedded in its</text>
<text class="t-desc" x="492" y="758">workflow, tested as embedded</text>
<rect class="b-cmp" x="32" y="800" width="652" height="92" rx="10"/>
<text class="t-code" x="48" y="828">scripts/ci_gate.sh</text>
<text class="t-type" x="48" y="846">[local tool]</text>
<text class="t-desc" x="48" y="870">Runs a job's run steps on a commit, inside the job's own pinned image, as root, as CI runs them.</text>
